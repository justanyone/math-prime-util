name: CI
on:
  push:
    branches: [main, "dev-*"]
  pull_request:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
# The feature lists in this file and in tools/gate.sh must match.
# Both use default, bigint, gmp, and all-features.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - run: sudo apt-get install -y libgmp-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo doc --no-deps --all-features
        env: { RUSTDOCFLAGS: -D warnings }
  test:
    name: test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "${{ matrix.rust }}" }
      - uses: taiki-e/install-action@nextest
      - run: sudo apt-get install -y libgmp-dev
      - run: cargo nextest run --all-features
      - run: cargo test --doc --all-features
  # The GMP backend on its own: feature gmp without bigint, after the system GMP is installed.
  # The pure-Rust builds (default and --features bigint) run in the same job without GMP's headers.
  gmp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - run: cargo build
      - run: cargo build --features bigint
      - run: sudo apt-get install -y libgmp-dev
      - run: cargo nextest run --features gmp
      - run: cargo test --doc --features gmp
  test-bigint:
    name: test-bigint (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "${{ matrix.rust }}" }
      - run: cargo test --features bigint
  # Other platforms and toolchains: only on pushes to main and dev-* (not on pull requests), to save runner time.
  test-extra:
    if: github.event_name == 'push'
    name: test-extra (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest, windows-latest]
        rust: [stable]
        include:
          - { os: ubuntu-latest, rust: beta }
          - { os: ubuntu-latest, rust: nightly }
          # The gmp feature links the system GMP, which these runners do not provide: pure Rust there.
          - { os: macos-latest, features: "--features bigint" }
          - { os: windows-latest, features: "--features bigint" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "${{ matrix.rust }}" }
      - uses: taiki-e/install-action@nextest
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y libgmp-dev
      - run: cargo nextest run ${{ matrix.features || '--all-features' }}
      - run: cargo test --doc ${{ matrix.features || '--all-features' }}
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: sudo apt-get install -y libgmp-dev
      - run: cargo build --all-features
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: llvm-tools-preview }
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: sudo apt-get install -y libgmp-dev
      - run: cargo llvm-cov --all-features --fail-under-lines 95 --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with: { name: lcov, path: lcov.info }
  bench:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get install -y libgmp-dev
      - name: Benchmark base and head on this runner
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Base rule: judge a push against the commit it replaced (github.event.before), so a push to a
          # dev branch is not measured against the last release. A new branch (all-zero "before") or a
          # force push (commit missing) falls back to the merge base with main.
          if [ "${BEFORE#0000000000000000000000000000000000000000}" != "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE=$(git merge-base origin/main "$GITHUB_SHA")
          fi
          echo "Base commit: $BEFORE"
          mkdir -p "$RUNNER_TEMP/base"
          git archive "$BEFORE" | tar -x -C "$RUNNER_TEMP/base"
          # Shared runners differ by more than 10 % on identical code, and one runner drifts by 10 % over
          # an hour. So build both trees, then run the two binaries of each bench file back to back
          # (base, then head) and let both write to one criterion directory.
          export CRITERION_HOME="$RUNNER_TEMP/criterion"
          (cd "$RUNNER_TEMP/base" && CARGO_TARGET_DIR="$RUNNER_TEMP/base-target" cargo bench --all-features --no-run --message-format=json > "$RUNNER_TEMP/base.json")
          cargo bench --all-features --no-run --message-format=json > "$RUNNER_TEMP/head.json"
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import time

          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          root = pathlib.Path(os.environ["CRITERION_HOME"])

          def benches(name):
              found = {}
              for line in (temp / name).read_text().splitlines():
                  if not line.startswith("{"):
                      continue
                  msg = json.loads(line)
                  if msg.get("reason") == "compiler-artifact" and msg.get("executable") and "bench" in msg["target"]["kind"]:
                      found[msg["target"]["name"]] = msg["executable"]
              return found

          base, head = benches("base.json"), benches("head.json")

          def lower_bound(path):
              # Lower bound of the 95 % interval of the mean change (0.10 = 10 % slower).
              return json.loads(path.read_text())["mean"]["confidence_interval"]["lower_bound"]

          def run_pair(name, exe, only=None):
              # Base first, then head: the two measurements of one bench are minutes apart.
              # --baseline-lenient skips benches that the base does not have.
              filt = ["--bench"] + ([only] if only else [])
              if name in base:
                  subprocess.run([base[name], *filt, "--save-baseline", "base"], cwd=temp / "base", check=True)
              return subprocess.run([exe, *filt, "--baseline-lenient", "base", "--output-format", "bencher"],
                                    stdout=subprocess.PIPE, text=True, check=True).stdout

          suspects = []
          with open("bench.txt", "w") as out:
              for name, exe in sorted(head.items()):
                  started = time.time()
                  text = run_pair(name, exe)  # also feeds the history chart (bencher output)
                  sys.stdout.write(text)
                  out.write(text)
                  for path in sorted(root.glob("**/change/estimates.json")):
                      if path.stat().st_mtime >= started and lower_bound(path) > 0.10:
                          suspects.append((name, exe, path))

          # A shared runner still shows a 10 % shift on a few of the 270 benches now and then. A bench counts as
          # slower only when two more base/head pairs of that bench keep the lower bound above 10 %.
          failures = []
          for name, exe, path in suspects:
              ident = str(path.parent.parent.relative_to(root))
              # The directory name is a sanitized form of the id; the filter needs the real id.
              full_id = json.loads((path.parent.parent / "new" / "benchmark.json").read_text())["full_id"]
              lower = lower_bound(path)
              for attempt in (1, 2):
                  run_pair(name, exe, "^" + re.escape(full_id) + "$")
                  lower = lower_bound(path)
                  print(f"{ident}: repeat {attempt}, change lower bound {lower:.1%}")
                  if lower <= 0.10:
                      break
              if lower > 0.10:
                  failures.append((ident, lower))
          if failures:
              for ident, lower in failures:
                  print(f"::error::{ident} is slower (change lower bound {lower:.1%})")
              sys.exit(1)
          print("No benchmark has a change lower bound above 10%.")
          PY
      - uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: cargo
          output-file-path: bench.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          alert-threshold: "110%"
          comment-on-alert: true
          # The stored results come from other shared runners, which differ by more than 10 % on the same
          # code (2026-10-19: half of the pushes failed here with no slower code). An alert is a comment only.
          fail-on-alert: false
