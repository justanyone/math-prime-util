name: CI
on:
  push:
    branches: [main, "dev-*"]
  pull_request:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
# The feature lists in this file and in tools/gate.sh must match.
# Both use default, bigint, gmp, and all-features.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - run: sudo apt-get install -y libgmp-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo doc --no-deps --all-features
        env: { RUSTDOCFLAGS: -D warnings }
  test:
    name: test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "${{ matrix.rust }}" }
      - uses: taiki-e/install-action@nextest
      - run: sudo apt-get install -y libgmp-dev
      - run: cargo nextest run --all-features
      - run: cargo test --doc --all-features
  # The GMP backend on its own: feature gmp without bigint, after the system GMP is installed.
  # The pure-Rust builds (default and --features bigint) run in the same job without GMP's headers.
  gmp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - run: cargo build
      - run: cargo build --features bigint
      - run: sudo apt-get install -y libgmp-dev
      - run: cargo nextest run --features gmp
      - run: cargo test --doc --features gmp
  test-bigint:
    name: test-bigint (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "${{ matrix.rust }}" }
      - run: cargo test --features bigint
  # Other platforms and toolchains: only on pushes to main and dev-* (not on pull requests), to save runner time.
  test-extra:
    if: github.event_name == 'push'
    name: test-extra (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest, windows-latest]
        rust: [stable]
        include:
          - { os: ubuntu-latest, rust: beta }
          - { os: ubuntu-latest, rust: nightly }
          # The gmp feature links the system GMP, which these runners do not provide: pure Rust there.
          - { os: macos-latest, features: "--features bigint" }
          - { os: windows-latest, features: "--features bigint" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "${{ matrix.rust }}" }
      - uses: taiki-e/install-action@nextest
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y libgmp-dev
      - run: cargo nextest run ${{ matrix.features || '--all-features' }}
      - run: cargo test --doc ${{ matrix.features || '--all-features' }}
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: sudo apt-get install -y libgmp-dev
      - run: cargo build --all-features
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: llvm-tools-preview }
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: sudo apt-get install -y libgmp-dev
      - run: cargo llvm-cov --all-features --fail-under-lines 95 --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with: { name: lcov, path: lcov.info }
  bench:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get install -y libgmp-dev
      - name: Benchmark merge base and head on this runner
        shell: bash
        run: |
          set -euo pipefail
          base=$(git merge-base origin/main "$GITHUB_SHA")
          mkdir -p "$RUNNER_TEMP/base"
          git archive "$base" | tar -x -C "$RUNNER_TEMP/base"
          cp -a target "$RUNNER_TEMP/base/" 2>/dev/null || true
          (cd "$RUNNER_TEMP/base" && cargo bench --all-features -- --save-baseline base)
          cargo bench --all-features -- --baseline base
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          failures = []
          for path in pathlib.Path("target/criterion").glob("*/new/estimates.json"):
              estimates = json.loads(path.read_text())
              change = estimates.get("change", {})
              lower = change.get("confidence_interval", {}).get("lower_bound")
              if lower is not None and lower > 0.10:
                  failures.append((path.parts[-3], lower))
          if failures:
              for name, lower in failures:
                  print(f"::error::{name} is slower (change lower bound {lower:.1%})")
              sys.exit(1)
          print("No benchmark has a change lower bound above 10%.")
          PY
          cargo bench --all-features -- --output-format bencher | tee bench.txt
      - uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: cargo
          output-file-path: bench.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          alert-threshold: "110%"
          comment-on-alert: false
          fail-on-alert: false
