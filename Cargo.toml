[package]
name = "math-prime-util"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Rust port of Perl's Math::Prime::Util: primality, sieves, factoring, number theory"
license = "GPL-1.0-or-later OR Artistic-1.0-Perl"
repository = "https://github.com/justanyone/math-prime-util"
documentation = "https://docs.rs/math-prime-util"
readme = "README.md"
keywords = ["prime", "number-theory", "factoring", "sieve", "primality"]
categories = ["mathematics", "algorithms"]
publish = false
exclude = ["reference/", ".perl-local/", "tools/", ".github/"]

[dependencies]
getrandom = { version = "0.3", features = ["std"] }
num-bigint = { version = "0.4", optional = true }
num-integer = { version = "0.1", optional = true }
num-traits = { version = "0.2", optional = true }

[features]
bigint = ["dep:num-bigint", "dep:num-integer", "dep:num-traits"]

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false }

[lib]
# The lib test harness rejects criterion flags (`--output-format bencher`); benches live in benches/.
bench = false

[[bench]]
name = "primality"
harness = false

[[bench]]
name = "arith"
harness = false

[[bench]]
name = "bits_ops1"
harness = false

[[bench]]
name = "combinat"
harness = false

[[bench]]
name = "count"
harness = false

[[bench]]
name = "digits"
harness = false

[[bench]]
name = "factor"
harness = false

[[bench]]
name = "families"
harness = false

[[bench]]
name = "int"
harness = false

[[bench]]
name = "lucas"
harness = false

[[bench]]
name = "modular"
harness = false

[[bench]]
name = "random"
harness = false

[[bench]]
name = "rational"
harness = false

[[bench]]
name = "real"
harness = false

[[bench]]
name = "sieve"
harness = false

[[bench]]
name = "vec"
harness = false
[[bench]]
name = "bits_pos"
harness = false

[[bench]]
name = "iter"
harness = false

[[bench]]
name = "misc_gap"
harness = false


# Tests sieve and count over large ranges: unoptimised builds make the gate take tens of minutes. Overflow checks and debug assertions stay on.
[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true

[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Number theory code names its variables after the formulas.
many_single_char_names = "allow"
similar_names = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
